<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Not here — Haren Poovaiah</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/dp-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..500&family=Instrument+Serif:ital@0;1&display=swap">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></noscript>
<style>
:root{--ink:#f2efe9;--mute:rgba(242,239,233,.55);--line:rgba(242,239,233,.16);--ember:#e2703a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--ink)}
body{font-family:"DM Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(60% 50% at 50% 40%,rgba(226,112,58,.10),transparent 70%),#000}
main{max-width:520px;text-align:center}
.mark{width:56px;height:56px;margin:0 auto 32px;opacity:.85}
small{display:block;letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:var(--mute);margin-bottom:18px}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(40px,9vw,72px);line-height:1;letter-spacing:-.01em}
h1 em{color:var(--ember)}
p{color:var(--mute);font-weight:300;line-height:1.6;margin:20px auto 36px;max-width:38ch}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{color:var(--ink);text-decoration:none;font-size:14px;padding:12px 20px;border:1px solid var(--line);border-radius:999px;transition:border-color .3s,background .3s}
a:hover,a:focus-visible{border-color:var(--ember);background:rgba(226,112,58,.08)}
a.main{background:var(--ink);color:#000;border-color:var(--ink)}
a.main:hover{background:var(--ember);border-color:var(--ember);color:#000}
</style>
</head>
<body>
<main>
  <img class="mark" src="/assets/img/dp-mark.svg" alt="">
  <small>Error 404</small>
  <h1>This page was <em>never built.</em></h1>
  <p>The link may be old, or the address has a typo. Everything that exists is one step away.</p>
  <nav>
    <a class="main" href="/">Back to the start</a>
    <a href="/#/work">The Work</a>
    <a href="/#/hire">Work with me</a>
  </nav>
</main>
</body>
</html>
